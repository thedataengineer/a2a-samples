[project]
name = "mcp-a2a-gateway"
version = "0.1.0"
description = "Production MCP-to-A2A Dynamic Protocol Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.0",
    "click>=8.1.0",
    "httpx>=0.28.1",
    "mcp>=1.13.0",
    "pydantic>=2.11.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
